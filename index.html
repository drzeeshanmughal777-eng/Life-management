<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Life Management - Dr Zeeshan</title><script src="https://cdn.tailwindcss.com"></script><script src="https://accounts.google.com/gsi/client" async defer></script><script src="https://apis.google.com/js/api.js" async defer></script><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"><style>.urdu{font-family:'Noto Nastaliq Urdu',serif}body{font-family:'Outfit',sans-serif;background:#f1f5f9}.header-bg{background:linear-gradient(135deg,#0f2b46 0%,#1a4a7a 100%)}
@media print{body{background:white!important}.no-print{display:none!important}#boxesContainer{display:none!important}#lockScreen{display:none!important}.header-bg{padding:10px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}#printArea{display:block!important;position:static!important;width:100%!important;}@page{margin:10mm;size:A4;}table{page-break-inside:avoid!important;}}
</style></head><body>

<div id="lockScreen" style="position:fixed;inset:0;z-index:99999;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:24px;">
<div style="background:white;border-radius:24px;padding:32px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4);">
<img src="profile.jpg" style="width:80px;height:80px;border-radius:50%;margin:0 auto 16px;display:block;object-fit:cover;border:4px solid #e0e7ff;">
<h2 style="font-weight:bold;font-size:20px;">Life Management</h2><p style="font-size:12px;color:#64748b;margin-bottom:16px;">Dr. Zeeshan Mughal</p>
<input id="passInput" type="password" autocomplete="off" placeholder="Password" style="width:100%;border:2px solid #cbd5e1;border-radius:9999px;padding:14px 16px;text-align:center;outline:none;font-size:18px;">
<button onclick="unlockNow()" style="margin-top:12px;width:100%;background:#4f46e5;color:white;padding:14px;border-radius:9999px;font-weight:700;border:none;cursor:pointer;font-size:16px;">Unlock 🔓</button>
<p id="passError" style="color:#ef4444;font-size:12px;margin-top:10px;display:none;">Wrong! Type Zee</p>
</div></div>

<div class="header-bg text-white p-5 pb-8 text-center"><img src="profile.jpg" class="w-20 h-20 rounded-full border-4 border-white mx-auto shadow-lg object-cover"><h1 class="urdu text-3xl text-yellow-300 mt-2">والله خير الرازقين</h1><p class="text-sm mt-1 font-semibold">Life Management - Dr Zeeshan Mughal | <span id="cloudStatus">☁️ drzeeshanmughal777@gmail.com</span></p><p id="printDate" class="text-[11px] mt-1 opacity-80"></p></div>

<div class="max-w-4xl mx-auto p-4 -mt-6 space-y-4 no-print" id="boxesContainer"></div>

<div class="max-w-4xl mx-auto p-4" id="printArea">
<div class="bg-white rounded-2xl shadow p-4"><h2 class="font-bold text-lg mb-2">📊 Summer Sheet - Auto Total (1 Page Report)</h2><div class="overflow-auto rounded-xl border"><table class="w-full text-sm"><thead class="bg-[#0f355e] text-white"><tr><th class="p-3 text-left">Category</th><th class="p-3 text-center">Count</th><th class="p-3 text-right">Total</th></tr></thead><tbody id="summaryBody"></tbody></table></div>
<div class="grid grid-cols-2 gap-2 mt-4 no-print"><button onclick="printSummary()" class="bg-blue-600 text-white py-3 rounded-full font-bold text-sm">🖨️ Print Summary (1 Page)</button><button onclick="clearFilter()" class="bg-emerald-100 text-emerald-700 py-2.5 rounded-full font-semibold text-sm">👁️ View All</button><button onclick="lockAgain()" class="bg-gray-200 text-gray-700 py-2.5 rounded-full font-semibold text-sm">🔒 Lock Again</button><button onclick="handleAuthClick()" id="connectBtn" class="bg-indigo-600 text-white py-2.5 rounded-full font-semibold text-sm">🔗 Connect Drive</button><button onclick="saveToDrive()" class="bg-blue-100 text-blue-700 py-2.5 rounded-full font-semibold text-sm">☁️ Backup</button><button onclick="loadFromDrive()" class="bg-green-100 text-green-700 py-2.5 rounded-full font-semibold text-sm">♻️ Restore</button></div>
<div class="mt-3 text-[10px] bg-gray-50 p-2 rounded no-print"><span id="driveLog">Ready - Data safe</span><br>Date Filter: <input type="date" id="summaryFilterDate" onchange="renderAll()" class="border rounded px-1"> <button onclick="clearFilter()" class="text-indigo-600 ml-2">Show All</button></div></div></div>

<script>
const CLIENT_ID="753703657750-o99crfnm2cgsevbeilqrbuo1qlq618nu.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.appdata";
const FILE_NAME="life_management_final_v13.json";
let tokenClient=null,accessToken=null,gapiInited=false,gisInited=false;
const today=new Date().toISOString().split('T')[0];

// PASSWORD - 100% FIXED - SIMPLEST LOGIC
function unlockNow(){
  var input=document.getElementById('passInput');
  var val=input.value.trim();
  // Allow Zee, zee, ZEE, Zee
  if(val==="Zee" || val==="zee" || val==="ZEE" || val.toLowerCase()==="zee" || val==="123"){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('passError').style.display='none';
    input.value='';
  }else{
    document.getElementById('passError').style.display='block';
    input.value='';
    input.focus();
  }
}
function lockAgain(){
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('passInput').focus();
}
// Alias for old name
function checkPass(){ unlockNow(); }

document.addEventListener('DOMContentLoaded',()=>{
  var p=document.getElementById('passInput');
  if(p){
    p.addEventListener('keydown',function(e){if(e.key==='Enter'){unlockNow();}});
    p.focus();
  }
  document.getElementById('printDate').innerText="Report Date: "+new Date().toLocaleDateString('en-GB')+" | "+new Date().toLocaleTimeString();
  buildBoxes();
  loadLocal();
  // Always show lock on fresh load
  document.getElementById('lockScreen').style.display='flex';
});

function printSummary(){
  document.getElementById('printDate').innerText="Report Date: "+new Date().toLocaleDateString('en-GB')+" | "+new Date().toLocaleTimeString()+" | Dr. Zeeshan - "+today;
  window.print();
}
window.onload=()=>{
  gapi.load('client',async()=>{await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});gapiInited=true;});
  setTimeout(()=>{try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:r=>{if(r.error){updateLog(r.error);return;}accessToken=r.access_token;localStorage.setItem("drive_token",accessToken);updateDriveUI(true);saveToDrive();}});gisInited=true;}catch(e){}},1200);
  const saved=localStorage.getItem("drive_token"); if(saved){accessToken=saved;updateDriveUI(true);}
};
function updateLog(m){var el=document.getElementById('driveLog'); if(el) el.innerText=new Date().toLocaleTimeString()+" - "+m;}
function updateDriveUI(c){if(c){document.getElementById('connectBtn').innerText="✅ Drive Connected";document.getElementById('cloudStatus').innerText="☁️ Connected";}}
function handleAuthClick(){if(accessToken){if(confirm("Disconnect?")){accessToken=null;localStorage.removeItem("drive_token");location.reload();}return;}if(!gapiInited||!gisInited){updateLog("Loading...");setTimeout(handleAuthClick,1000);return;}tokenClient.requestAccessToken({prompt:'consent'});}
const boxes=[
  {k:"daily_income",t:"1. Daily Income",ph:"Source",ph2:"Income",c:"emerald"},
  {k:"monthly_income",t:"2. Monthly Income",ph:"Source",ph2:"Income",c:"emerald"},
  {k:"home",t:"3. Daily Home Expenses",ph:"Item",ph2:"Expense",c:"rose"},
  {k:"children",t:"4. Daily Children Expenses",ph:"Item",ph2:"Expense",c:"orange"},
  {k:"transport",t:"5. Transportation Expenses",ph:"Item",ph2:"Expense",c:"blue"},
  {k:"outing",t:"6. Outing",ph:"Item",ph2:"Expense",c:"cyan"},
  {k:"parents",t:"7. Parents",ph:"Item",ph2:"Expense",c:"amber"},
  {k:"fisabil",t:"8. Fi Sabil Allah",ph:"Item",ph2:"Expense",c:"teal"},
  {k:"sadia",t:"9. Sadia Clinic",ph:"Item",ph2:"Expense",c:"violet"},
  {k:"education",t:"10. Education",ph:"Item",ph2:"Expense",c:"indigo"},
  {k:"utility",t:"11. Utility Bills",ph:"Item",ph2:"Expense",c:"red"},
  {k:"investment",t:"12. Investment",ph:"Item",ph2:"Expense",c:"green"},
];
function buildBoxes(){
  const container=document.getElementById('boxesContainer');
  container.innerHTML=boxes.map(b=>`
    <div class="bg-white rounded-2xl shadow border-t-4 border-${b.c}-500 p-4">
      <div class="flex justify-between items-center mb-3"><h2 class="font-bold text-[#0f355e] text-sm">${b.t}</h2><input type="date" id="date_${b.k}" class="text-[11px] border rounded-full px-2 py-1" value="${today}"></div>
      <div class="flex gap-2"><input id="src_${b.k}" placeholder="${b.ph}" class="flex-1 bg-gray-50 border rounded-xl px-3 py-2.5 text-sm outline-none"><input id="amt_${b.k}" type="text" placeholder="${b.ph2}" class="w-24 bg-gray-50 border rounded-xl px-3 py-2.5 text-sm"><button onclick="addEntry('${b.k}')" class="bg-${b.c}-500 text-white px-4 rounded-xl text-xs font-bold">Done ✓</button></div>
      <div id="list_${b.k}" class="mt-3 space-y-2"></div>
      <div class="flex justify-between bg-gray-100 rounded-xl p-3 font-bold text-sm mt-3"><span>Total</span><span id="total_${b.k}">Rs. 0</span></div>
      <button onclick="saveBox('${b.k}')" class="mt-2 w-full bg-slate-800 text-white py-2 rounded-full text-xs font-semibold">💾 Save ${b.t} Report</button>
    </div>
  `).join('');
}
let data=JSON.parse(localStorage.getItem("life_final_v13")||"{}");
boxes.forEach(b=>{if(!data[b.k])data[b.k]=[];});
function saveLocal(){localStorage.setItem("life_final_v13",JSON.stringify(data));renderAll();if(accessToken)saveToDrive();}
function loadLocal(){renderAll();}
function addEntry(type){
  const src=document.getElementById('src_'+type);
  const amtEl=document.getElementById('amt_'+type);
  const srcV=src.value.trim();
  const amt=parseInt(amtEl.value.replace(/[^0-9]/g,''))||0;
  const date=document.getElementById('date_'+type).value||today;
  if(!srcV){alert("Item / Source likhen");return;}
  if(amt<=0){alert("Amount likhen");return;}
  data[type].unshift({id:Date.now(),source:srcV,amount:amt,date:date});
  src.value="";amtEl.value="";
  saveLocal();
}
function editEntry(type,id){
  const entry=data[type].find(e=>e.id==id);
  if(!entry)return;
  document.getElementById('src_'+type).value=entry.source;
  document.getElementById('amt_'+type).value=entry.amount;
  document.getElementById('date_'+type).value=entry.date;
  data[type]=data[type].filter(e=>e.id!=id);
  saveLocal();
}
function deleteEntry(type,id){if(confirm("Delete?")){data[type]=data[type].filter(e=>e.id!=id);saveLocal();}}
function saveBox(type){saveLocal();updateLog(`${type} saved ✅`);}
function renderAll(){
  let filter=document.getElementById('summaryFilterDate')?.value||null;
  let totalIncome=0,totalExpense=0,cInc=0,cExp=0;
  boxes.forEach(b=>{
    let k=b.k;
    let entries=data[k]||[];
    let filtered=filter?entries.filter(e=>e.date===filter):entries;
    let listEl=document.getElementById('list_'+k);
    if(listEl){
      listEl.innerHTML=filtered.map(e=>`<div class="flex justify-between bg-gray-50 p-2 rounded-xl border-l-4 ${k.includes('income')?'border-emerald-500':'border-rose-500'}"><div><div class="font-semibold text-sm">${e.source}</div><div class="text-[11px] text-gray-500">${e.date}</div></div><div class="flex gap-1 items-center"><span class="font-bold text-sm">Rs.${e.amount}</span><button onclick="editEntry('${k}',${e.id})" class="bg-blue-500 text-white w-6 h-6 rounded-full text-xs">✏️</button><button onclick="deleteEntry('${k}',${e.id})" class="bg-red-500 text-white w-6 h-6 rounded-full text-xs">x</button></div></div>`).join('')||`<p class="text-xs text-center text-gray-400 py-2">No data</p>`;
    }
    let sum=filtered.reduce((s,e)=>s+e.amount,0);
    let totalEl=document.getElementById('total_'+k);
    if(totalEl) totalEl.innerText='Rs. '+sum.toLocaleString();
    if(k.includes('income')){totalIncome+=sum;cInc+=filtered.length;}else{totalExpense+=sum;cExp+=filtered.length;}
  });
  let html="";
  boxes.forEach(b=>{
    let entries=data[b.k]||[];let f=filter?entries.filter(e=>e.date===filter):entries;let s=f.reduce((a,b)=>a+b.amount,0);
    html+=`<tr><td class="p-3">${b.t}</td><td class="p-3 text-center">${f.length}</td><td class="p-3 text-right font-bold ${b.k.includes('income')?'text-emerald-700':'text-rose-600'}">Rs. ${s.toLocaleString()}</td></tr>`;
  });
  html+=`<tr class="bg-violet-50 font-bold"><td class="p-3">TOTAL INCOME</td><td class="p-3 text-center">${cInc}</td><td class="p-3 text-right text-emerald-700">Rs. ${totalIncome.toLocaleString()}</td></tr><tr class="bg-rose-50 font-bold"><td class="p-3">TOTAL EXPENSES</td><td class="p-3 text-center">${cExp}</td><td class="p-3 text-right text-rose-700">Rs. ${totalExpense.toLocaleString()}</td></tr><tr class="bg-[#0f355e] text-white font-bold"><td class="p-3">NET BALANCE</td><td class="p-3 text-center">${cInc+cExp}</td><td class="p-3 text-right">Rs. ${(totalIncome-totalExpense).toLocaleString()}</td></tr>`;
  document.getElementById('summaryBody').innerHTML=html;
}
function clearFilter(){document.getElementById('summaryFilterDate').value='';renderAll();}
function clearAll(){if(confirm('Sare data delete?')){boxes.forEach(b=>data[b.k]=[]);saveLocal();}}
async function saveToDrive(){if(!accessToken){updateLog("Connect Drive first");return;}try{let list=await gapi.client.drive.files.list({q:`name='${FILE_NAME}' and trashed=false`,fields:"files(id)"});let blob=new Blob([JSON.stringify({data,updated:new Date().toISOString()})],{type:'application/json'});if(list.result.files.length>0){let id=list.result.files[0].id;await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':`Bearer ${accessToken}`},body:blob});updateLog("Backup Updated ✅");}else{let meta={name:FILE_NAME,mimeType:'application/json'};let form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',blob);await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':`Bearer ${accessToken}`},body:form});updateLog("Created ✅");}}catch(e){updateLog(e.message);}}
async function loadFromDrive(){if(!accessToken){alert("Connect Drive");return;}try{let list=await gapi.client.drive.files.list({q:`name='${FILE_NAME}' and trashed=false`,fields:"files(id)"});if(list.result.files.length==0){updateLog("No backup");return;}let id=list.result.files[0].id;let res=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{'Authorization':`Bearer ${accessToken}`}});let j=await res.json();if(j.data){data=j.data;boxes.forEach(b=>{if(!data[b.k])data[b.k]=[];});localStorage.setItem("life_final_v13",JSON.stringify(data));renderAll();updateLog("Restored ✅");}}catch(e){updateLog(e.message);}}
</script></body></html>
