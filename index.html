<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Life Management - Dr Zeeshan</title><script src="https://cdn.tailwindcss.com"></script><script src="https://accounts.google.com/gsi/client" async defer></script><script src="https://apis.google.com/js/api.js" async defer></script><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"><style>.urdu{font-family:'Noto Nastaliq Urdu',serif}body{font-family:'Outfit',sans-serif;background:#f1f5f9}.header-bg{background:linear-gradient(135deg,#0f2b46 0%,#1a4a7a 100%)}@media print{body{background:white!important}.no-print{display:none!important}#boxesContainer{display:none!important}#lockScreen{display:none!important}#printArea{display:block!important;width:100%!important}@page{margin:10mm}}</style></head><body>
<div id="lockScreen" style="position:fixed;inset:0;z-index:99999;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:24px;"><div style="background:white;border-radius:24px;padding:32px;width:100%;max-width:340px;text-align:center;"><img src="profile.jpg" style="width:80px;height:80px;border-radius:50%;margin:0 auto 16px;display:block;object-fit:cover;border:4px solid #e0e7ff;"><h2 style="font-weight:bold;">Life Management</h2><p style="font-size:12px;color:#64748b;margin-bottom:12px;">Dr. Zeeshan Mughal</p><input id="passInput" type="password" placeholder="Password" style="width:100%;border:2px solid #cbd5e1;border-radius:9999px;padding:14px;text-align:center;font-size:18px;outline:none;"><button onclick="unlockNow()" style="margin-top:12px;width:100%;background:#4f46e5;color:white;padding:14px;border-radius:9999px;font-weight:700;border:none;cursor:pointer;">Unlock 🔓</button><p id="passError" style="color:#ef4444;font-size:12px;margin-top:10px;display:none;">Wrong! Type Zee</p></div></div>
<div class="header-bg text-white p-5 pb-8 text-center"><img src="profile.jpg" class="w-20 h-20 rounded-full border-4 border-white mx-auto object-cover"><h1 class="urdu text-3xl text-yellow-300 mt-2">والله خير الرازقين</h1><p class="text-sm mt-1 font-semibold">Life Management - Dr Zeeshan | <span id="cloudStatus">☁️ Connected</span></p><p id="printDate" class="text-[11px] mt-1 opacity-80"></p></div>
<div class="max-w-4xl mx-auto p-4 -mt-6 space-y-4 no-print" id="boxesContainer"></div>
<div class="max-w-4xl mx-auto p-4" id="printArea"><div class="bg-white rounded-2xl shadow p-4"><h2 class="font-bold text-lg mb-2">📊 Summer Sheet - 1 Page Report</h2><div class="rounded-xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-[#0f355e] text-white"><tr><th class="p-3 text-left">Category</th><th class="p-3 text-center">Count</th><th class="p-3 text-right">Total</th></tr></thead><tbody id="summaryBody"></tbody></table></div>
<div class="grid grid-cols-2 gap-2 mt-4 no-print"><button onclick="window.print()" class="bg-blue-600 text-white py-3 rounded-full font-bold text-sm">🖨️ Print Summary (1 Page)</button><button onclick="viewAllData()" class="bg-emerald-500 text-white py-3 rounded-full font-bold text-sm">👁️ View All</button><button onclick="lockAgain()" class="bg-gray-200 text-gray-700 py-2.5 rounded-full font-semibold text-sm">🔒 Lock Again</button><button id="connectBtn" onclick="handleAuthClick()" class="bg-indigo-600 text-white py-2.5 rounded-full font-semibold text-sm">🔗 Connect Drive</button><button onclick="saveToDrive()" class="bg-blue-100 text-blue-700 py-2.5 rounded-full font-semibold text-sm">☁️ Backup</button><button onclick="loadFromDrive()" class="bg-green-100 text-green-700 py-2.5 rounded-full font-semibold text-sm">♻️ Restore</button></div>
<div class="mt-3 text-[10px] bg-gray-50 p-2 rounded no-print"><span id="driveLog">Save + View All Fixed ✅</span><br>Date Filter: <input type="date" id="summaryFilterDate" onchange="renderAll()" class="border rounded px-2 py-1"> <button onclick="viewAllData()" class="text-indigo-600 ml-2 font-bold">Show All</button></div></div></div>
<script>
const CLIENT_ID="753703657750-o99crfnm2cgsevbeilqrbuo1qlq618nu.apps.googleusercontent.com";const SCOPES="https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.appdata";const FILE_NAME="life_management_final_v13.json";let tokenClient=null,accessToken=null,gapiInited=false,gisInited=false;const today=new Date().toISOString().split('T')[0];
function unlockNow(){var v=document.getElementById('passInput').value.trim().toLowerCase();if(v==="zee"){document.getElementById('lockScreen').style.display='none';document.getElementById('passError').style.display='none';}else{document.getElementById('passError').style.display='block';document.getElementById('passInput').value='';document.getElementById('passInput').focus();}}
function lockAgain(){document.getElementById('lockScreen').style.display='flex';}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')unlockNow();});document.getElementById('printDate').innerText="Report: "+new Date().toLocaleDateString('en-GB')+" "+new Date().toLocaleTimeString();buildBoxes();loadLocal();document.getElementById('lockScreen').style.display='flex';});
window.onload=()=>{gapi.load('client',async()=>{await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});gapiInited=true;});setTimeout(()=>{try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:r=>{if(r.error)return;accessToken=r.access_token;localStorage.setItem("drive_token",accessToken);updateDriveUI(true);}});gisInited=true;}catch(e){}},1200);const s=localStorage.getItem("drive_token");if(s){accessToken=s;updateDriveUI(true);}};
function updateLog(m){document.getElementById('driveLog').innerText=new Date().toLocaleTimeString()+" - "+m;}function updateDriveUI(c){if(c)document.getElementById('connectBtn').innerText="✅ Drive Connected";}
function handleAuthClick(){if(accessToken){if(confirm("Disconnect?")){accessToken=null;localStorage.removeItem("drive_token");location.reload();}return;}if(!gapiInited||!gisInited){setTimeout(handleAuthClick,1000);return;}tokenClient.requestAccessToken({prompt:'consent'});}
const boxes=[{k:"daily_income",t:"1. Daily Income",ph:"Source",ph2:"Income",c:"emerald"},{k:"monthly_income",t:"2. Monthly Income",ph:"Source",ph2:"Income",c:"emerald"},{k:"home",t:"3. Daily Home Expenses",ph:"Item",ph2:"Expense",c:"rose"},{k:"children",t:"4. Daily Children Expenses",ph:"Item",ph2:"Expense",c:"orange"},{k:"transport",t:"5. Transportation Expenses",ph:"Item",ph2:"Expense",c:"blue"},{k:"outing",t:"6. Outing",ph:"Item",ph2:"Expense",c:"cyan"},{k:"parents",t:"7. Parents",ph:"Item",ph2:"Expense",c:"amber"},{k:"fisabil",t:"8. Fi Sabil Allah",ph:"Item",ph2:"Expense",c:"teal"},{k:"sadia",t:"9. Sadia Clinic",ph:"Item",ph2:"Expense",c:"violet"},{k:"education",t:"10. Education",ph:"Item",ph2:"Expense",c:"indigo"},{k:"utility",t:"11. Utility Bills",ph:"Item",ph2:"Expense",c:"red"},{k:"investment",t:"12. Investment",ph:"Item",ph2:"Expense",c:"green"}];
function buildBoxes(){document.getElementById('boxesContainer').innerHTML=boxes.map(b=>`<div class="bg-white rounded-2xl shadow border-t-4 border-${b.c}-500 p-4"><div class="flex justify-between items-center mb-3"><h2 class="font-bold text-[#0f355e] text-sm">${b.t}</h2><input type="date" id="date_${b.k}" class="text-[11px] border rounded-full px-2 py-1" value="${today}"></div><div class="flex gap-2"><input id="src_${b.k}" placeholder="${b.ph}" class="flex-1 bg-gray-50 border rounded-xl px-3 py-2.5 text-sm outline-none"><input id="amt_${b.k}" type="text" placeholder="${b.ph2}" class="w-24 bg-gray-50 border rounded-xl px-3 py-2.5 text-sm"><button onclick="addEntry('${b.k}')" class="bg-${b.c}-500 text-white px-4 rounded-xl text-xs font-bold">Done ✓</button></div><div id="list_${b.k}" class="mt-3 space-y-2"></div><div class="flex justify-between bg-gray-100 rounded-xl p-3 font-bold text-sm mt-3"><span>Total</span><span id="total_${b.k}">Rs. 0</span></div><button id="btn_${b.k}" onclick="saveReport('${b.k}')" class="mt-2 w-full bg-slate-800 text-white py-3 rounded-full text-xs font-bold">💾 Save ${b.t} Report</button></div>`).join('');}
let data=JSON.parse(localStorage.getItem("life_final_v13")||"{}");boxes.forEach(b=>{if(!data[b.k])data[b.k]=[];});
function saveLocal(){localStorage.setItem("life_final_v13",JSON.stringify(data));renderAll();if(accessToken)saveToDrive();}function loadLocal(){renderAll();}
function addEntry(t){let s=document.getElementById('src_'+t),a=document.getElementById('amt_'+t);if(!s.value.trim()){alert("Item likhen");return;}let amt=parseInt(a.value.replace(/[^0-9]/g,''))||0;if(amt<=0){alert("Amount likhen");return;}data[t].unshift({id:Date.now(),source:s.value.trim(),amount:amt,date:document.getElementById('date_'+t).value||today});s.value="";a.value="";saveLocal();updateLog(t+" added Rs."+amt);}
function saveReport(t){saveLocal();let b=document.getElementById('btn_'+t);let tot=document.getElementById('total_'+t).innerText;updateLog(t+" saved ✅ "+tot+" - Summary updated");let old=b.innerHTML;b.innerHTML="✅ Saved! "+tot;b.style.background="#16a34a";setTimeout(()=>{b.innerHTML=old;b.style.background="#1e293b";},2000);document.getElementById('printArea').scrollIntoView({behavior:'smooth'});}
function viewAllData(){let f=document.getElementById('summaryFilterDate');if(f)f.value='';renderAll();updateLog("View All ✅ All entries visible - Balance updated");window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
function editEntry(t,id){let e=data[t].find(x=>x.id==id);if(!e)return;document.getElementById('src_'+t).value=e.source;document.getElementById('amt_'+t).value=e.amount;document.getElementById('date_'+t).value=e.date;data[t]=data[t].filter(x=>x.id!=id);saveLocal();}
function deleteEntry(t,id){if(confirm("Delete?")){data[t]=data[t].filter(x=>x.id!=id);saveLocal();}}
function renderAll(){let f=document.getElementById('summaryFilterDate').value;let inc=0,exp=0,ci=0,ce=0;boxes.forEach(b=>{let k=b.k,ents=data[k]||[],filt=f?ents.filter(x=>x.date===f):ents;let el=document.getElementById('list_'+k);if(el)el.innerHTML=filt.map(e=>`<div class="flex justify-between bg-gray-50 p-2 rounded-xl border-l-4 ${k.includes('income')?'border-emerald-500':'border-rose-500'}"><div><div class="font-semibold text-sm">${e.source}</div><div class="text-[11px] text-gray-500">${e.date}</div></div><div class="flex gap-1 items-center"><span class="font-bold text-sm">Rs.${e.amount}</span><button onclick="editEntry('${k}',${e.id})" class="bg-blue-500 text-white w-6 h-6 rounded-full text-xs">✏️</button><button onclick="deleteEntry('${k}',${e.id})" class="bg-red-500 text-white w-6 h-6 rounded-full text-xs">x</button></div></div>`).join('')||`<p class="text-xs text-center text-gray-400 py-2">${f?'No data - View All dabayen':'No data'}</p>`;let s=filt.reduce((a,x)=>a+x.amount,0);document.getElementById('total_'+k).innerText='Rs. '+s.toLocaleString();if(k.includes('income')){inc+=s;ci+=filt.length;}else{exp+=s;ce+=filt.length;}});let h="";boxes.forEach(b=>{let ents=data[b.k]||[],ff=f?ents.filter(x=>x.date===f):ents,ss=ff.reduce((a,x)=>a+x.amount,0);h+=`<tr><td class="p-3">${b.t}</td><td class="p-3 text-center">${ff.length}</td><td class="p-3 text-right font-bold ${b.k.includes('income')?'text-emerald-700':'text-rose-600'}">Rs. ${ss.toLocaleString()}</td></tr>`;});h+=`<tr class="bg-violet-50 font-bold"><td class="p-3">TOTAL INCOME</td><td class="p-3 text-center">${ci}</td><td class="p-3 text-right text-emerald-700">Rs. ${inc.toLocaleString()}</td></tr><tr class="bg-rose-50 font-bold"><td class="p-3">TOTAL EXPENSES</td><td class="p-3 text-center">${ce}</td><td class="p-3 text-right text-rose-700">Rs. ${exp.toLocaleString()}</td></tr><tr class="bg-[#0f355e] text-white font-bold"><td class="p-3">NET BALANCE</td><td class="p-3 text-center">${ci+ce}</td><td class="p-3 text-right">Rs. ${(inc-exp).toLocaleString()}</td></tr>`;document.getElementById('summaryBody').innerHTML=h;}
async function saveToDrive(){if(!accessToken)return;try{let l=await gapi.client.drive.files.list({q:`name='${FILE_NAME}' and trashed=false`,fields:"files(id)"});let bl=new Blob([JSON.stringify({data})],{type:'application/json'});if(l.result.files.length>0){await fetch(`https://www.googleapis.com/upload/drive/v3/files/${l.result.files[0].id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':`Bearer ${accessToken}`},body:bl});}else{let m={name:FILE_NAME,mimeType:'application/json'};let fd=new FormData();fd.append('metadata',new Blob([JSON.stringify(m)],{type:'application/json'}));fd.append('file',bl);await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':`Bearer ${accessToken}`},body:fd});}updateLog("Backup ✅");}catch(e){updateLog(e.message);}}
async function loadFromDrive(){if(!accessToken){alert("Connect Drive");return;}try{let l=await gapi.client.drive.files.list({q:`name='${FILE_NAME}' and trashed=false`,fields:"files(id)"});if(!l.result.files.length){updateLog("No backup");return;}let r=await fetch(`https://www.googleapis.com/drive/v3/files/${l.result.files[0].id}?alt=media`,{headers:{'Authorization':`Bearer ${accessToken}`}});let j=await r.json();if(j.data){data=j.data;boxes.forEach(b=>{if(!data[b.k])data[b.k]=[];});localStorage.setItem("life_final_v13",JSON.stringify(data));renderAll();updateLog("Restored ✅");}}catch(e){updateLog(e.message);}}
</script></body></html>
